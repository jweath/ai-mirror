name: Verify AI Mirror
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.lock
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - run: ai-mirror validate-course config/course.example.json
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: ai-mirror-student-file
          path: skills/ai-mirror/SKILL.md
